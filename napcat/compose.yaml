services:
  napcat:
    image: mlikiowa/napcat-docker@sha256:070e09398f07fc08535a5bacfc7236ecd8444fff7212c1fedfecfba50a598f37
    container_name: personal-ai-napcat
    platform: linux/amd64
    restart: unless-stopped
    environment:
      NAPCAT_UID: "1000"
      NAPCAT_GID: "1000"
    env_file:
      - ./secrets/napcat.env
    ports:
      - "127.0.0.1:6099:6099"
    volumes:
      - ./config:/app/napcat/config
      - ./plugins:/app/napcat/plugins
      - ./qq:/app/.config/QQ
      - ./logs:/app/napcat/logs
    networks:
      napcat_internal:
        ipv4_address: 172.30.0.2
    shm_size: "256m"
    mem_limit: "1400m"
    mem_reservation: "384m"
    cpus: 1.5

networks:
  napcat_internal:
    name: personal-ai-napcat-internal
    driver: bridge
    ipam:
      config:
        - subnet: 172.30.0.0/24
          gateway: 172.30.0.1
